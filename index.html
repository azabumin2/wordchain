<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>끝말잇기 · しりとり · Word Chain</title>
<style>
:root{--ink:#2b2b3a;--head:#2b2b3a;--card:rgba(255,255,255,.93);--accent:#ff7a59;--blue:#5b8def;--line:#e6e2f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{font-family:"Meiryo","Malgun Gothic","Noto Sans KR","Noto Sans JP","Noto Sans SC","Nirmala UI","Noto Sans Devanagari",system-ui,sans-serif;color:var(--ink);min-height:100vh;min-height:100dvh;overflow-x:hidden;transition:background .6s;position:relative}
body.t1{background:linear-gradient(#bfe9ff,#eaf9ff 55%,#c9f2b8)}
body.t2{background:linear-gradient(#ffd6a5,#fff0d2 55%,#b9e6a2)}
body.t3{background:linear-gradient(#1c1b4a,#3a2f7d 60%,#5b3f9a);--head:#fff}
#deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#deco span{position:absolute;font-size:34px;opacity:.85;animation:drift 9s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(18px,-16px) rotate(6deg)}}
#app{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:16px 16px 40px}
h1{margin:6px 0 0;text-align:center;font-size:34px;color:var(--head);letter-spacing:.02em}
.sub{margin:4px 0 14px;text-align:center;color:var(--head);opacity:.85;font-size:15px}
h2{margin:18px 0 8px;font-size:16px;color:var(--head)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 15px;font:inherit;font-size:15px;cursor:pointer;transition:transform .15s}
.chip:active{transform:scale(.95)}
.chip.on{border-color:var(--accent);background:#fff3ee;font-weight:700}
.lvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lv{border:3px solid transparent;background:var(--card);border-radius:20px;padding:8px 4px 10px;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.lv.on{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 18px rgba(255,122,89,.3)}
.lv .mini{width:86px;height:86px}
.lv b{font-size:16px}.lv small{font-size:11px;opacity:.75;text-align:center;line-height:1.3;min-height:28px}
.lv em{font-style:normal;background:var(--accent);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.opt{display:flex;gap:8px;align-items:flex-start;margin:14px 0 8px;font-size:14px;color:var(--head);line-height:1.4}
.opt input{width:20px;height:20px;margin-top:1px}
.small{font-size:13px;color:var(--head);opacity:.85}
button.ghost{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 14px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
button.ghost:disabled{opacity:.4}
button.big{width:100%;margin:18px 0 12px;border:0;border-radius:22px;padding:17px;font:inherit;font-size:22px;font-weight:800;color:#fff;background:linear-gradient(135deg,#ff8a5c,#ff5c8a);box-shadow:0 8px 20px rgba(255,92,138,.35);cursor:pointer}
button.big:active{transform:scale(.98)}
.card{background:var(--card);border-radius:20px;padding:12px 14px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
details.card summary{cursor:pointer;font-weight:700}
details.card ul{margin:8px 0 2px;padding-left:20px;line-height:1.7;font-size:14px}
/* game */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
#hearts{font-size:20px;letter-spacing:1px}
#lvBadge{font-weight:800;font-size:14px;background:var(--accent);color:#fff;border-radius:999px;padding:3px 12px}
.sc{text-align:right;line-height:1.1}.sc b{font-size:26px}.sc small{display:block;font-size:11px;opacity:.7}
.timer{height:10px;background:rgba(255,255,255,.7);border-radius:99px;margin:10px 0;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#5bd18b,#ffd23f);border-radius:99px}
.timer i.low{background:linear-gradient(90deg,#ff7a59,#ff4d6d)}
.stage{position:relative;overflow:hidden;text-align:center;padding:10px 10px 14px}
.char{width:150px;height:150px;margin:0 auto}
.char svg,.mini svg{width:100%;height:100%;overflow:visible;animation:bob 2.6s ease-in-out infinite}
.bubble{position:relative;display:inline-block;min-width:150px;margin-top:8px;background:#fff;border:3px solid var(--line);border-radius:22px;padding:8px 22px;font-size:34px;font-weight:800;letter-spacing:.04em}
.bubble:before{content:"";position:absolute;top:-12px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:var(--line)}
.bubble.in{animation:pop .35s}
.need{margin-top:8px;font-size:15px;font-weight:700;color:#d6461f;min-height:22px}
#fx{position:absolute;inset:0;pointer-events:none}
.cf{position:absolute;font-size:22px;animation:cf 1.1s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
.plus{position:absolute;left:50%;top:34%;font-size:34px;font-weight:900;color:#ff5c8a;text-shadow:0 2px 0 #fff;animation:plus 1.1s ease-out forwards}
@keyframes plus{from{transform:translate(-50%,0) scale(.6);opacity:0}20%{opacity:1;transform:translate(-50%,-10px) scale(1.2)}to{transform:translate(-50%,-70px) scale(1);opacity:0}}
.chain{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px;min-height:34px}
.chain span{padding:4px 12px;border-radius:999px;font-size:14px;background:#fff;border:2px solid var(--line)}
.chain span.ai{background:#e8f1ff;border-color:#b9d1ff}.chain span.p{background:#fff1e8;border-color:#ffc9a8}
.chain span:last-child{font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.msg{min-height:24px;text-align:center;font-weight:700;font-size:15px;color:var(--head)}
.msg.ok{color:#15964f}.msg.bad{color:#e03b3b}
body.t3 .msg.ok{color:#8bf5b8}body.t3 .msg.bad{color:#ff9d9d}
form{display:flex;gap:8px;margin:8px 0}
#inp{flex:1;min-width:0;border:3px solid var(--line);border-radius:16px;padding:13px 14px;font:inherit;font-size:20px;background:#fff;color:var(--ink)}
#inp:focus{outline:none;border-color:var(--blue)}
#sendBtn{border:0;border-radius:16px;padding:0 20px;font:inherit;font-size:17px;font-weight:800;color:#fff;background:var(--blue);cursor:pointer}
.acts{justify-content:center;margin-top:6px;gap:6px}.acts .ghost{padding:9px 11px;font-size:14px}#endBtn{border-color:#ffb3b3;color:#c0392b}.bubble{cursor:pointer}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.overlay{position:fixed;inset:0;z-index:10;background:rgba(20,20,40,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.overlay .card{width:100%;max-width:380px;text-align:center;padding:22px}
.overlay h3{margin:0 0 6px;font-size:26px}.overlay .big2{font-size:52px;font-weight:900;color:var(--accent);margin:4px 0}
.overlay .btns{display:flex;gap:10px;margin-top:14px}.overlay .btns button{flex:1}
/* animations */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes jump{0%{transform:translateY(0)}30%{transform:translateY(-28px) scale(1.06,.94)}60%{transform:translateY(0) scale(.96,1.05)}100%{transform:none}}
@keyframes droop{0%,100%{transform:none}30%{transform:translateY(6px) rotate(-5deg)}60%{transform:translateY(6px) rotate(5deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
@keyframes talk{to{transform:scaleY(1.9)}}
@keyframes flapL{50%{transform:rotate(35deg)}}@keyframes flapR{50%{transform:rotate(-35deg)}}
.char[data-mood=happy] svg{animation:jump .6s ease 2}
.char[data-mood=sad] svg{animation:droop 1s ease}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.mouth{transform-box:fill-box;transform-origin:50% 0}
.talk .mouth{animation:talk .22s ease infinite alternate}
.wingL,.wingR{transform-box:fill-box}.wingL{transform-origin:100% 15%}.wingR{transform-origin:0% 15%}
.char[data-mood=happy] .wingL{animation:flapL .25s 4}.char[data-mood=happy] .wingR{animation:flapR .25s 4}
.eyes-happy,.tear{display:none}
.char[data-mood=happy] .eyes{display:none}.char[data-mood=happy] .eyes-happy{display:inline}
.char[data-mood=sad] .tear{display:inline}
.bq{position:fixed;top:-120px;width:64px;height:76px;z-index:30;pointer-events:none;animation:fall var(--d) linear forwards}
.bq svg{width:100%;height:100%;animation:sway 1.4s ease-in-out infinite alternate}
@keyframes fall{to{transform:translate(var(--sx),calc(100vh + 160px)) rotate(var(--r))}}
@keyframes sway{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.cele{position:fixed;left:50%;top:38%;z-index:31;width:min(86vw,340px);transform:translate(-50%,-50%);text-align:center;background:#fff;border:4px solid #ffb3c6;border-radius:26px;padding:14px 16px 16px;box-shadow:0 14px 40px rgba(255,92,138,.4);pointer-events:none;animation:celeIn .5s cubic-bezier(.2,1.4,.4,1),celeOut .5s ease 5.2s forwards;color:#2b2b3a}
.cele svg{width:96px;height:114px;animation:bob 1s ease-in-out infinite}
.cele b{display:block;font-size:22px;line-height:1.35;color:#e0457b}
.cele span{display:block;margin-top:4px;font-size:15px}
@keyframes celeIn{from{transform:translate(-50%,-50%) scale(.3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes celeOut{to{opacity:0;transform:translate(-50%,-70%) scale(.9)}}
@media (max-width:380px){.lv .mini{width:70px;height:70px}h1{font-size:28px}.bubble{font-size:28px}}
.cele .cshare{display:inline-block;margin-top:10px;pointer-events:auto;cursor:pointer;border:0;border-radius:999px;background:#ff5c8a;color:#fff;font:inherit;font-size:15px;font-weight:700;padding:9px 18px;box-shadow:0 4px 0 #d9457a}
.cele .cshare:active{transform:translateY(2px);box-shadow:0 2px 0 #d9457a}
.overlay .sbtns{display:flex;gap:10px;margin-top:14px}.overlay .sbtns button{flex:1;font-size:15px;padding:10px 6px}
.overlay .sbtns .follow{background:#1d9bf0;color:#fff;border-color:#1d9bf0}
#toast{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);z-index:60;background:rgba(30,30,50,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;max-width:88vw;text-align:center}
</style>
</head>
<body class="t1">
<div id="deco"></div>
<main id="app">
  <section id="home">
    <h1 id="hTitle"></h1>
    <p class="sub" id="hSub"></p>
    <div class="row" id="langRow" style="justify-content:center"></div>
    <h2 id="hLevel"></h2>
    <div class="lvgrid" id="lvGrid"></div>
    <h2 id="hTopic"></h2>
    <div class="row" id="topicRow"></div>
    <label class="opt"><input type="checkbox" id="lenient" checked><span id="lenientT"></span></label>
    <div class="row"><button class="ghost" id="dictBtn" type="button"></button><span class="small" id="dictInfo"></span><input type="file" id="dictFile" accept=".txt,.csv,.tsv,.json" hidden></div>
    <button class="big" id="startBtn" type="button"></button>
    <details class="card"><summary id="rulesH"></summary><ul id="rulesT"></ul></details>
    <p class="small" id="credit" style="text-align:center;margin:10px 0 24px" hidden></p>
  </section>

  <section id="game" hidden>
    <div class="top card"><div id="hearts"></div><span id="lvBadge"></span><div class="sc"><b id="score">0</b><small id="bestL"></small></div></div>
    <div class="timer"><i id="tbar"></i></div>
    <div class="stage card" id="stage">
      <div class="char" id="char" data-mood=""></div>
      <div class="bubble" id="bubble"><span id="aiWord">…</span></div>
      <div class="need" id="need"></div>
      <div id="fx"></div>
    </div>
    <div class="chain" id="chain"></div>
    <div class="msg" id="msg"></div>
    <form id="form" autocomplete="off"><input id="inp" type="text" autocapitalize="off" autocorrect="off" spellcheck="false"><button id="sendBtn" type="submit"></button></form>
    <div class="row acts"><button class="ghost" id="hintBtn" type="button"></button><button class="ghost" id="passBtn" type="button"></button><button class="ghost" id="soundBtn" type="button"></button><button class="ghost" id="endBtn" type="button"></button><button class="ghost" id="homeBtn" type="button" hidden></button></div>
  </section>
</main>

<div class="overlay" id="over" hidden>
  <div class="card">
    <div class="char" id="overChar" style="width:110px;height:110px" data-mood="sad"></div>
    <h3 id="overT"></h3>
    <div class="small" id="overS" style="color:var(--ink)"></div>
    <div class="big2" id="overScore">0</div>
    <div id="overInfo" style="font-size:14px"></div>
    <div class="sbtns"><button class="big" id="overShare" type="button" style="margin:0"></button><button class="big follow" id="overFollow" type="button" style="margin:0" hidden></button></div>
    <div class="btns"><button class="ghost" id="overHome" type="button"></button><button class="big" id="overAgain" type="button" style="margin:0;font-size:18px;padding:12px"></button></div>
  </div>
</div>

<script>
'use strict';
/* ============ 1. 내장 단어 (시제품용 소형 사전) ============ */

const KO_Y=[2,3,6,7,12,17,20]; // ㅑㅒㅕㅖㅛㅠㅣ
function koEnds(ch){ // 두음법칙: 리→이, 력→역, 녀→여 ...
  const c=ch.charCodeAt(0)-0xAC00; if(c<0||c>11171) return [ch];
  const ini=Math.floor(c/588), med=Math.floor((c%588)/28), fin=c%28;
  const mk=i=>String.fromCharCode(0xAC00+(i*21+med)*28+fin), out=[ch];
  if(ini===5) out.push(KO_Y.includes(med)?mk(11):mk(2));
  else if(ini===2&&KO_Y.includes(med)) out.push(mk(11));
  return out;
}

/* ============ 5. 사전 DB ============ */
const $=s=>document.querySelector(s);
const EXTRA={ko:[],en:[],ja:[],zh:[],hi:[]};
const DBS={};
let lang='ko',level=1,topic='all',lenient=true;
function mkEntry(raw,tg,known){
 const H=LANG[lang],n=H.norm(raw);
 return {w:n,d:lang==='hi'?raw.trim().normalize('NFC'):n,tg,sk:H.sk(n),ek:H.ek(n),len:[...n].length,bad:H.lose(n),known};
}
function db(){
 if(DBS[lang]) return DBS[lang];
 const H=LANG[lang],list=[],map=new Map(),byStart=new Map();
 const add=(w,tg)=>{const n=H.norm(w);if(!n||!H.valid(n)||map.has(n))return;const e=mkEntry(w,tg,true);map.set(n,e);list.push(e);
   if(!byStart.has(e.sk))byStart.set(e.sk,[]);byStart.get(e.sk).push(e);};
 for(const tg of ['f','a','p','i','g'])(RAW[lang][tg]||'').split(/\s+/).filter(Boolean).forEach(w=>add(w,tg));
 EXTRA[lang].forEach(w=>add(w,'g'));
 return DBS[lang]={list,map,byStart};
}
const okTopic=e=>topic==='all'||e.tg===topic;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function sample(a,n){if(a.length<=n)return a.slice();const s=new Set();while(s.size<n)s.add(Math.floor(Math.random()*a.length));return [...s].map(i=>a[i]);}
let used=new Set();
function candidates(prev){
 const d=db(),min=LANG[lang].min,out=[],seen=new Set();
 for(const k of prev.ek)for(const x of (d.byStart.get(k)||[])){
  if(seen.has(x.w)||used.has(x.w))continue;seen.add(x.w);
  if(x===prev||x.bad||!okTopic(x)||x.len<min)continue;out.push(x);}
 return out;
}
const followers=e=>candidates(e).length;
const strict=()=>!(lenient&&topic==='all');

 const S=T[lang];document.documentElement.lang=lang;document.title=S.title+' · Word Chain';
 $('#hTitle').textContent=['🐥','🦊','🦉'][level-1]+' '+S.title;$('#hSub').textContent=S.sub;
 $('#langRow').innerHTML=Object.keys(T).map(k=>`<button class="chip ${k===lang?'on':''}" data-lang="${k}" type="button">${T[k].name}</button>`).join('');
 $('#hLevel').textContent=S.hLevel;
 $('#lvGrid').innerHTML=[1,2,3].map(l=>`<button class="lv ${l===level?'on':''}" data-lv="${l}" type="button"><div class="mini">${charSVG(l)}</div><b>${S.lv[l-1]}</b><small>${S.lvd[l-1]}</small><em>+${LV[l].pts}${S.pt}</em></button>`).join('');
 $('#hTopic').textContent=S.hTopic;
 if(topic!=='all'&&!RAW[lang][topic])topic='all';
 $('#topicRow').innerHTML=Object.keys(S.topics).filter(k=>k==='all'||RAW[lang][k]).map(k=>`<button class="chip ${k===topic?'on':''}" data-topic="${k}" type="button">${S.topics[k]}</button>`).join('');
 $('#lenientT').textContent=S.lenient;$('#dictBtn').textContent=S.dict;
 $('#dictInfo').textContent=EXTRA[lang].length?S.dictN(EXTRA[lang].length):'';
 $('#credit').hidden=lang!=='ko';$('#credit').innerHTML='단어 데이터: 국립국어원 <a href="https://stdict.korean.go.kr" target="_blank" rel="noopener">표준국어대사전</a> (CC BY-SA 2.0 KR)';
 $('#startBtn').textContent=S.start;$('#rulesH').textContent=S.rulesH;$('#rulesT').innerHTML=S.rules.concat([S.ruleCele]).map(r=>`<li>${r}</li>`).join('');
 setDeco();
}
$('#langRow').onclick=e=>{const b=e.target.closest('[data-lang]');if(!b)return;lang=b.dataset.lang;renderHome();tryAutoDict();};
$('#lvGrid').onclick=e=>{const b=e.target.closest('[data-lv]');if(!b)return;level=+b.dataset.lv;renderHome();};
$('#topicRow').onclick=e=>{const b=e.target.closest('[data-topic]');if(!b)return;topic=b.dataset.topic;renderHome();};
$('#lenient').onchange=e=>{lenient=e.target.checked;};
$('#dictBtn').onclick=()=>$('#dictFile').click();
async function loadWords(txt){
 let words;try{const j=JSON.parse(txt);words=Array.isArray(j)?j:Object.keys(j);}catch(_){words=txt.split(/[\r\n,\t;]+/);}
 const H=LANG[lang];words=words.map(w=>String(w).trim()).filter(w=>{const n=H.norm(w);return n&&H.valid(n);});
 EXTRA[lang]=EXTRA[lang].concat(words);delete DBS[lang];renderHome();
}
$('#dictFile').onchange=async e=>{const f=e.target.files[0];if(f)await loadWords(await f.text());e.target.value='';};
async function tryAutoDict(){ // 같은 폴더의 dict_ko.txt 등을 자동 로드 (http/https 환경)
 if(EXTRA[lang].length||location.protocol==='file:')return;
 try{const r=await fetch('dict_'+lang+'.txt');if(r.ok)await loadWords(await r.text());}catch(_){}
}

/* ============ 7. 게임 ============ */
let score=0,hearts=0,hints=0,total=0,busy=false,chain=[],cur=null,tInt=null,tEnd=0,tTotal=0,moodT=null,best=0;
const bestKey=()=>`wc_best_${lang}_${level}`;
function getBest(){try{return +localStorage.getItem(bestKey())||0;}catch(_){return 0;}}
function setBest(v){try{localStorage.setItem(bestKey(),v);}catch(_){}}
function mood(m,ms=1300){const c=$('#char');c.dataset.mood=m;clearTimeout(moodT);moodT=setTimeout(()=>c.dataset.mood='',ms);}
function talk(ms){const c=$('#char');c.classList.add('talk');setTimeout(()=>c.classList.remove('talk'),ms);}
function msg(t,k=''){const m=$('#msg');m.textContent=t;m.className='msg '+k;}
function renderTop(){
 $('#hearts').textContent='❤️'.repeat(hearts)+'🤍'.repeat(Math.max(0,LV[level].hearts-hearts));
 $('#score').textContent=score;$('#bestL').textContent=T[lang].best+' '+Math.max(best,score);
 $('#hintBtn').textContent=T[lang].hint+(LV[level].hints?` (${hints})`:'');
 $('#hintBtn').disabled=!LV[level].hints||hints<=0||busy;
}
function renderChain(){
 $('#chain').innerHTML=chain.slice(-10).map(c=>`<span class="${c.who}">${c.w}</span>`).join('');
}
function popup(txt){const s=document.createElement('div');s.className='plus';s.textContent=txt;$('#fx').appendChild(s);setTimeout(()=>s.remove(),1200);}
function confetti(){const L=['⭐','✨','🎉','💛','🌟'],fx=$('#fx');for(let i=0;i<14;i++){const s=document.createElement('span');s.className='cf';s.textContent=L[i%L.length];
 s.style.left='50%';s.style.top='38%';s.style.setProperty('--dx',(Math.random()*260-130)+'px');s.style.setProperty('--dy',(-40-Math.random()*130)+'px');fx.appendChild(s);setTimeout(()=>s.remove(),1200);}}
function stopTimer(){clearInterval(tInt);tInt=null;}
function startTimer(){
 stopTimer();tTotal=LV[level].time*1000;tEnd=Date.now()+tTotal;const bar=$('#tbar');
 tInt=setInterval(()=>{const r=tEnd-Date.now();bar.style.width=Math.max(0,r/tTotal*100)+'%';bar.classList.toggle('low',r<tTotal*.3);
  if(r<=0){stopTimer();loseHeart('timeout');}},100);
}
function startGame(){
 over=false;gen++;voiceWarned=false;stopSpeech();const L=LV[level];score=0;hearts=L.hearts;hints=L.hints;total=0;best=getBest();
 $('#home').hidden=true;$('#game').hidden=false;$('#over').hidden=true;
 $('#char').innerHTML=charSVG(level);
 $('#lvBadge').textContent=['🐥','🦊','🦉'][level-1]+' '+T[lang].lv[level-1]+' · +'+L.pts;
 $('#inp').placeholder=T[lang].ph;$('#sendBtn').textContent=T[lang].send;$('#passBtn').textContent=T[lang].pass;$('#homeBtn').textContent='🏠';$('#endBtn').textContent='🏁 '+T[lang].endG;renderSound();
 setDeco();newRound();
}
function newRound(){
 used=new Set();chain=[];cur=null;renderChain();msg('');$('#need').textContent='';
 const d=db(),min=LANG[lang].min;
 let pool=d.list.filter(e=>okTopic(e)&&e.len>=min&&!e.bad);
 if(!pool.length){msg(T[lang].noCand,'bad');return gameOver();}
 const s=sample(pool,60).map(e=>({e,f:followers(e)}));
 let ok=s.filter(x=>x.f>=2);if(!ok.length)ok=s.filter(x=>x.f>=1);if(!ok.length)ok=s;
 if(LV[level].ai==='easy'){ok.sort((a,b)=>a.e.len-b.e.len);ok=ok.slice(0,Math.max(3,Math.ceil(ok.length*.6)));}
 aiSay(pick(ok).e);
}
function aiSay(e){
 busy=true;stopTimer();$('#tbar').style.width='100%';renderTop();
 $('#aiWord').textContent=T[lang].think;talk(800);
 later(()=>{
  used.add(e.w);cur=e;chain.push({w:e.d,who:'ai'});renderChain();
  $('#aiWord').textContent=e.d;const b=$('#bubble');b.classList.remove('in');void b.offsetWidth;b.classList.add('in');
  const keys=[...new Set(e.ek)];$('#need').textContent=T[lang].need(keys);
  speak(e.d);
  if(followers(e)===0&&strict()){later(()=>loseHeart('trap'),1400);return;}
  busy=false;renderTop();startTimer();const i=$('#inp');i.value='';i.focus({preventScroll:true});
 },850);
}
function aiChoose(prev){
 const L=LV[level],c=sample(candidates(prev),80);if(!c.length)return null;
 const sc=c.map(e=>({e,f:followers(e)}));
 if(strict()&&Math.random()<L.trap){const z=sc.filter(s=>s.f===0);if(z.length)return pick(z).e;}
 let ok=sc.filter(s=>s.f>0);
 if(!ok.length){if(L.ai==='easy')return 'concede';ok=sc;}
 if(L.ai==='easy'){const g=ok.filter(s=>s.f>=3);if(g.length)ok=g;ok.sort((a,b)=>a.e.len-b.e.len);return pick(ok.slice(0,Math.max(3,Math.ceil(ok.length*.5)))).e;}
 if(L.ai==='hard'){ok.sort((a,b)=>a.f-b.f);return pick(ok.slice(0,Math.max(2,Math.ceil(ok.length*.3)))).e;}
 return pick(ok).e;
}
function addScore(n){const prev=score;score+=n;renderTop();checkMilestone(prev,score);}
function endRoundBonus(mult,key){
 busy=true;stopTimer();const b=LV[level].pts*mult;addScore(b);popup('+'+b);confetti();mood('happy',1800);
 msg(`${T[lang][key]} ${T[lang].bonus} +${b}`,'ok');later(newRound,2200);
}
function err(k,a){
 msg(typeof T[lang][k]==='function'?T[lang][k](a):T[lang][k],'bad');
 const f=$('#form');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');
 if(LV[level].penalty&&k!=='e_empty'){loseHeart(null,true);}
}
function submit(raw){
 if(busy||!cur)return;const H=LANG[lang],S=T[lang];
 const n=H.norm(raw);
 if(!n)return err('e_empty');
 if(!H.valid(n))return err('e_script');
 if([...n].length<H.min)return err('e_len',H.min);
 if(!cur.ek.includes(H.sk(n)))return err('e_chain');
 if(used.has(n))return err('e_used');
 if(H.lose(n)){return loseHeart('lose_n');}
 let e=db().map.get(n);
 if(!e){if(strict())return err('e_dict');e=mkEntry(raw,'x',false);}
 else if(!okTopic(e))return err('e_topic');
 // 정답
 stopTimer();used.add(e.w);chain.push({w:e.d,who:'p'});renderChain();total++;speak(e.d);
 const pts=LV[level].pts;addScore(pts);popup('+'+pts);confetti();mood('happy');
 msg(pick(S.cheers),'ok');$('#inp').value='';cur=e;
 const c=candidates(e);
 if(!c.length){
  if(!e.known){busy=true;msg(S.unknown,'ok');return void later(newRound,2000);}
  const d=db(),dead=!e.ek.some(k=>(d.byStart.get(k)||[]).some(x=>x!==e&&!x.bad));
  return endRoundBonus(dead?5:3,dead?'dead':'giveup');
 }
 busy=true;renderTop();
 later(()=>{const r=aiChoose(e);if(r==='concede'||!r)return endRoundBonus(3,'giveup');aiSay(r);},900);
}
function loseHeart(reason,keep){
 if(!keep)stopTimer();hearts--;renderTop();mood('sad',1300);
 if(reason){const S=T[lang];msg(S[reason]||'','bad');}
 if(hearts<=0){busy=true;return later(gameOver,1100);}
 if(keep)return; // 오답 패널티: 같은 단어에서 계속
 busy=true;renderTop();later(newRound,1600);
}
function gameOver(){
 if(over)return;over=true;gen++;stopSpeech();stopTimer();busy=true;const S=T[lang];
 let nb=false;if(score>best){best=score;setBest(score);nb=score>0;}
 $('#overChar').innerHTML=charSVG(level);$('#overChar').dataset.mood='sad';
 $('#overT').textContent=S.over;$('#overS').textContent=S.finalScore;$('#overScore').textContent=score;
 $('#overInfo').innerHTML=`${S.words}: <b>${total}</b> · ${S.best}: <b>${best}</b>${nb?'<br>'+S.newBest:''}`;
 $('#overHome').textContent=S.home;$('#overAgain').textContent=S.again;
 $('#overShare').textContent=SH[lang].share;$('#overFollow').textContent=SH[lang].follow(FOLLOW_NAME);$('#overFollow').hidden=!FOLLOW_URL;
 $('#over').hidden=false;
}
$('#endBtn').onclick=()=>{if(!$('#game').hidden)gameOver();};
$('#soundBtn').onclick=()=>{soundOn=!soundOn;try{localStorage.setItem('wc_sound',soundOn?'1':'0');}catch(_){}renderSound();if(!soundOn)stopSpeech();else if(cur)speak(cur.d);};
$('#bubble').onclick=()=>{if(cur&&soundOn){stopSpeech();speak(cur.d);}};
$('#form').onsubmit=e=>{e.preventDefault();submit($('#inp').value);};
$('#hintBtn').onclick=()=>{
 if(busy||!cur||hints<=0)return;const S=T[lang];const c=candidates(cur);
 if(!c.length){msg(S.noCand,'bad');return;}
 const e=pick(c);hints--;renderTop();
 msg(level===1?S.hintFull(e.d):S.hintPart([...e.d][0],e.len),'ok');
};
$('#passBtn').onclick=()=>{if(busy)return;msg(T[lang].passed,'bad');loseHeart(null);};
$('#homeBtn').onclick=()=>{over=true;gen++;stopSpeech();document.querySelectorAll('.bq,.cele').forEach(e=>e.remove());stopTimer();$('#game').hidden=true;$('#home').hidden=false;$('#over').hidden=true;renderHome();};
$('#overHome').onclick=()=>$('#homeBtn').click();
$('#overAgain').onclick=()=>startGame();
$('#overShare').onclick=()=>shareText(SH[lang].res(T[lang].lv[level-1],score));
$('#overFollow').onclick=()=>{if(FOLLOW_URL)window.open(FOLLOW_URL,'_blank','noopener');};
$('#startBtn').onclick=()=>startGame();
renderHome();tryAutoDict();
</script>
